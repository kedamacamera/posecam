# 署名なしの .ipa をビルドする。iPhone へは Windows の Sideloadly で、自分の Apple ID で署名して入れる。
name: Build iOS

on:
  push:
    branches: [main]
    # アプリに関係ない変更ではビルドしない（macOS の実行時間を節約する）
    paths-ignore:
      - "README.md"
      - "tools/**"
      - ".github/workflows/convert-model.yml"
      - ".github/workflows/verify-processing.yml"
      - ".github/workflows/build-shapes.yml"
  workflow_dispatch:

jobs:
  build:
    # Apple シリコンの macOS ランナーは混雑で割り当てられないことがあるので、Intel 版を使う
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PoseCam.xcodeproj \
            -scheme PoseCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            POSECAM_COMMIT="${GITHUB_SHA::7}" \
            POSECAM_BUILD_DATE="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PoseCam.app Payload/
          # Apple Watch のアプリが中に入っているか（入っていなければビルドを失敗にする）
          ls Payload/PoseCam.app/Watch/PoseCamWatch.app/Info.plist
          zip -qry PoseCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PoseCam-ipa
          path: PoseCam.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
