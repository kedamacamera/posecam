# 署名なしの .ipa をビルドする。iPhone へは Windows の Sideloadly で、自分の Apple ID で署名して入れる。
name: Build iOS

on:
  push:
    branches: [main]
    # アプリに関係ない変更ではビルドしない（macOS の実行時間を節約する）
    paths-ignore:
      - "README.md"
      - "tools/**"
      - ".github/workflows/convert-model.yml"
      - ".github/workflows/verify-processing.yml"
      - ".github/workflows/build-shapes.yml"
  workflow_dispatch:

jobs:
  build:
    # Apple シリコンの macOS ランナーは混雑で割り当てられないことがあるので、Intel 版を使う
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Icon Composer のアイコン（AppIcon.icon）は Xcode 26 以降でないとビルドできないので、Xcode 26 を選ぶ
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          # XcodeGen は .icon の種類を知らないので、Icon Composer のアイコンとして扱うように書き換える
          python3 - <<'PY'
          import re
          p = "PoseCam.xcodeproj/project.pbxproj"
          s = open(p).read()
          def fix(m):
              line = re.sub(r"(lastKnownFileType|explicitFileType) = [^;]*; ", "", m.group(0))
              return line.replace("isa = PBXFileReference; ", "isa = PBXFileReference; lastKnownFileType = folder.iconcomposer.icon; ")
          s = re.sub(r"[^\n]*isa = PBXFileReference;[^\n]*path = AppIcon\.icon;[^\n]*", fix, s)
          open(p, "w").write(s)
          PY
          grep -n 'AppIcon.icon' PoseCam.xcodeproj/project.pbxproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PoseCam.xcodeproj \
            -scheme PoseCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            POSECAM_COMMIT="${GITHUB_SHA::7}" \
            POSECAM_BUILD_DATE="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PoseCam.app Payload/
          # Apple Watch のアプリが中に入っているか（入っていなければビルドを失敗にする）
          ls Payload/PoseCam.app/Watch/PoseCamWatch.app/Info.plist
          zip -qry PoseCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PoseCam-ipa
          path: PoseCam.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
