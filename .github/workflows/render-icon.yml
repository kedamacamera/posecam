# テスト用：Icon Composer のアイコンを、Xcode 26 の ictool で画像に書き出してログに出す（liquid-glass-icon ブランチだけ）
name: Render icon

on:
  push:
    branches: [liquid-glass-icon]
    paths:
      - "PoseCam/AppIcon.icon/**"
      - "tools/icon-variants/**"
      - ".github/workflows/render-icon.yml"

jobs:
  render:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find ictool
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          ls "$XC/Contents/Applications" || true
          sudo find /Applications /Library /usr/local -iname "*ictool*" 2>/dev/null | head
          sudo find / -maxdepth 3 -iname "Icon Composer*" 2>/dev/null | head
          T="$XC/Contents/Developer/usr/bin/ictool"
          echo "ICTOOL=$T" >> "$GITHUB_ENV"
          "$T" -h 2>&1 | head -60 || true; "$T" 2>&1 | head -60 || true
      - name: Render
        run: |
          mkdir -p out
          for ic in PoseCam/AppIcon.icon tools/icon-variants/*.icon; do
            [ -d "$ic" ] || continue
            n=$(basename "$ic" .icon)
            if [ -n "$ICTOOL" ]; then
              for r in Default Dark ClearLight TintedLight; do
                "$ICTOOL" "$ic" --export-image --output-file "out/${n}_${r}.png" --platform iOS --rendition "$r" --width 512 --height 512 --scale 1 2>&1 | tail -3 || true
              done
            fi
            # actool が作る平らな PNG（古い iOS 用）も見る
            mkdir -p "act/$n"; cp -R "$ic" "act/$n/AppIcon.icon"
            xcrun actool "act/$n/AppIcon.icon" --compile "act/$n" --platform iphoneos --minimum-deployment-target 17.0 --app-icon AppIcon --output-partial-info-plist "act/$n/p.plist" --target-device iphone --output-format human-readable-text 2>&1 | tail -5
            ls "act/$n"
            big=$(ls -S act/$n/*.png 2>/dev/null | head -1); [ -n "$big" ] && sips -Z 512 "$big" --out "out/${n}_actool.png" >/dev/null
          done
          ls -la out
      - name: Print images
        run: |
          for f in out/*.png; do echo "===IMG $f"; base64 -i "$f" | tr -d '\n'; echo; echo "===END"; done
