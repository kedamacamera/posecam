# テスト用：Icon Composer のアイコンを、Icon Composer の ictool で画像に書き出す（liquid-glass-icon ブランチだけ）
# 書き出した画像は icon-renders ブランチに置く
name: Render icon

on:
  push:
    branches: [liquid-glass-icon]
    paths:
      - "PoseCam/AppIcon.icon/**"
      - "tools/icon-variants/**"
      - ".github/workflows/render-icon.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          T="$XC/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
          mkdir -p out
          for ic in PoseCam/AppIcon.icon tools/icon-variants/*.icon; do
            n=$(basename "$ic" .icon)
            for r in Default Dark ClearLight TintedLight; do
              "$T" "$ic" --export-image --output-file "out/${n}_${r}.png" --platform iOS --rendition "$r" --width 512 --height 512 --scale 2
            done
            # ホーム画面と同じ大きさ（60pt @3x）
            "$T" "$ic" --export-image --output-file "out/${n}_home60.png" --platform iOS --rendition Default --width 60 --height 60 --scale 3
          done
          ls -la out
      - name: Push renders
        run: |
          cd out
          git init -q -b icon-renders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Icon renders for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" icon-renders
