# 美肌の改善前（main）と改善後（このブランチ）を同じ写真で比べる画像を作る（手動で実行する）。
name: Beauty compare

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'PoseCam/Processing/**'
      - 'PoseCam/Pose/PoseDetector.swift'
      - 'tools/beauty-compare/**'
      - '.github/workflows/beauty-compare.yml'

permissions:
  contents: write

jobs:
  compare:
    # verify-processing と同じ Intel 版（Apple シリコン版は混雑で割り当てられないことがある）
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: new
      - uses: actions/checkout@v4
        with:
          ref: main
          path: old

      - name: Fetch photos
        run: python3 new/tools/beauty-compare/fetch_images.py photos

      - name: Build (before and after)
        run: |
          for side in old new; do
            mkdir -p bin/$side
            ( cd $side && swiftc -O -target x86_64-apple-macos14 -o ../bin/$side/compare \
                PoseCam/Pose/Joint.swift PoseCam/Pose/PoseDetector.swift PoseCam/Pose/PoseMatcher.swift \
                PoseCam/Pose/PoseImporter.swift PoseCam/Pose/PoseTemplate.swift \
                PoseCam/Processing/FrameProcessor.swift PoseCam/Processing/PhotoFilter.swift \
                PoseCam/Processing/ProcessingSettings.swift PoseCam/Util/Locked.swift PoseCam/Processing/DirectFlash.swift \
                PoseCam/Processing/LegStretch.swift PoseCam/Camera/PhotoMetadata.swift PoseCam/Camera/PixelBufferRender.swift \
                ../new/tools/beauty-compare/main.swift )
            xcrun -sdk macosx metal -fcikernel -c $side/PoseCam/Processing/BeautyKernels.ci.metal -o bin/$side/kernels.air
            xcrun -sdk macosx metallib -cikernel bin/$side/kernels.air -o bin/$side/default.metallib
            xcrun coremlcompiler compile $side/PoseCam/Resources/Models/SkinSegmenter.mlmodel bin/$side/
          done

      - name: Run
        run: |
          photos=$(ls photos/*.jpg)
          extra="new/PoseCam/Resources/Poses/pose_00.jpg new/PoseCam/Resources/Poses/pose_23.jpg"
          ./bin/old/compare out/old $photos $extra
          ./bin/new/compare out/new $photos $extra
          python3 -m venv venv
          venv/bin/pip install --quiet pillow
          venv/bin/python new/tools/beauty-compare/sheet.py out/old out/new out/sheets
          cp photos/credits.txt out/sheets/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beauty-compare
          path: out/sheets/

      # 結果の画像を見られるよう、専用のブランチ（beauty-compare-results）にも置く（main には入れない）
      - name: Publish sheets
        if: always()
        run: |
          cd out/sheets
          git init -q -b beauty-compare-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Beauty compare ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:beauty-compare-results
