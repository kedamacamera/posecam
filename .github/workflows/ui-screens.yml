# 撮影画面を iOS シミュレーターで開いて、端末の表示の設定ごとにスクリーンショットを撮る。
# （「ボタンの形」「文字を太くする」「文字の大きさ」「iOS 17」で崩れないかを、実機の前に確かめる）
name: UI screenshots

on:
  push:
    branches: ["claude/**"]
    paths:
      - "PoseCam/UI/**"
      - ".github/workflows/ui-screens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project PoseCam.xcodeproj -scheme PoseCam -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -30
      - name: Screenshots
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/PoseCam.app
          BUNDLE=com.example.posecam
          mkdir -p shots
          xcrun simctl list runtimes
          # 入っている iOS のうち一番古いもの（あれば 17）で撮る
          RUNTIMES=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; r.sort(key=lambda x:[int(p) for p in x["version"].split(".")]); ids=[r[0]["identifier"]] if r else []; print(" ".join(dict.fromkeys(ids)))')
          for RT in $RUNTIMES; do
            VER=${RT##*iOS-}
            for DEV in "iPhone SE (3rd generation)" "iPhone 15"; do
              DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next((d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']=='$DEV'), ''))")
              [ -z "$DT" ] && continue
              UDID=$(xcrun simctl create "shot" "$DT" "$RT") || continue
              xcrun simctl boot "$UDID"
              xcrun simctl bootstatus "$UDID" -b
              xcrun simctl install "$UDID" "$APP"
              xcrun simctl privacy "$UDID" grant camera "$BUNDLE" || true
              xcrun simctl privacy "$UDID" grant microphone "$BUNDLE" || true
              xcrun simctl privacy "$UDID" grant photos "$BUNDLE" || true
              NAME=$(echo "$DEV" | tr -cd 'A-Za-z0-9')
              shoot() {
                # 入れ直してから開く（シミュレーターにはカメラがなく、続けて開くと「前回の起動で問題」の画面になる）
                xcrun simctl terminate "$UDID" "$BUNDLE" || true
                xcrun simctl uninstall "$UDID" "$BUNDLE" || true
                xcrun simctl install "$UDID" "$APP"
                xcrun simctl privacy "$UDID" grant camera "$BUNDLE" || true
                xcrun simctl privacy "$UDID" grant microphone "$BUNDLE" || true
                xcrun simctl launch "$UDID" "$BUNDLE" "${@:2}"
                sleep 8
                xcrun simctl io "$UDID" screenshot "shots/iOS${VER}_${NAME}_$1.png"
              }
              shoot normal
              # 熱でフラッシュが使えないときの警告（Debug ビルドの起動引数で出す）
              shoot heat -demoHeatWarning
              # ボタンの形・文字を太くする・文字を大きく
              xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ButtonShapesEnabled -bool YES
              xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility EnhancedTextLegibilityEnabled -bool YES
              xcrun simctl ui "$UDID" content_size extra-extra-extra-large || true
              shoot a11y
              xcrun simctl shutdown "$UDID"
              xcrun simctl delete "$UDID"
            done
          done
          ls -la shots
      # 成果物のダウンロードが使えない環境からも見られるよう、スクリーンショットを別のブランチに置く
      - name: Push screenshots to a branch
        if: always()
        run: |
          BR="ui-shots/${GITHUB_REF_NAME}"
          mkdir /tmp/out && cp shots/*.png /tmp/out/ || exit 0
          cd /tmp/out
          git init -q -b "$BR"
          git -c user.name=ci -c user.email=ci@example.com add .
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "UI screenshots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: shots
          retention-days: 7
