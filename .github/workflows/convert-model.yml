# 肌のマスクの Core ML モデルを作る（手動で実行する）。結果は SkinSegmenter-mlmodel として取り出せる。
name: Convert skin model

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # GPU 用の部品を入れるとディスクが足りなくなるので、CPU 版だけを入れる
      - name: Install converters
        run: |
          pip install --no-cache-dir "torch==2.2.*" --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "tensorflow-cpu==2.15.*" "tf2onnx==1.16.*" "onnx==1.15.*" \
            "coremltools==7.2" tflite-support pillow "numpy<2"
          # onnx2torch が torch を GPU 版に入れ替えないよう、依存は入れない
          pip install --no-cache-dir --no-deps onnx2torch

      - name: Convert
        run: python tools/convert_skin_model.py

      - uses: actions/upload-artifact@v4
        with:
          name: SkinSegmenter-mlmodel
          path: out/SkinSegmenter.mlmodel
