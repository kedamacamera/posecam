name: PoseCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  # Icon Composer のアイコン（AppIcon.icon）はフォルダだが、1 つのファイルとしてリソースに入れる
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # GitHub Actions のビルドで上書きする（手元でビルドしたときは空）
    POSECAM_COMMIT: ""
    POSECAM_BUILD_DATE: ""
targets:
  PoseCam:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: PoseCam
    # Apple Watch の「ポーズカメラ」（撮影画面を時計に映して、シャッターなどを押す）を同梱する
    dependencies:
      - target: PoseCamWatch
    info:
      path: PoseCam/Info.plist
      properties:
        CFBundleDisplayName: ポーズカメラ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # どのビルドか（設定の画面に出す）。GitHub Actions のビルドで、コミットとビルド日時を入れる
        PoseCamCommit: $(POSECAM_COMMIT)
        PoseCamBuildDate: $(POSECAM_BUILD_DATE)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad（iPad mini）でも縦向きだけ。UIRequiresFullScreen があるので、iPad でも縦だけにできる
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 写真・動画の撮影とポーズの判定にカメラを使用します。
        NSMicrophoneUsageDescription: 動画撮影時の録音にマイクを使用します。
        NSPhotoLibraryAddUsageDescription: 撮影した写真・動画を写真アプリに保存します。
        NSPhotoLibraryUsageDescription: アプリ内のアルバムで写真・動画を表示し、編集できるようにします。
        # リモートモニター（もう一台のスマホに撮影画面を映す）
        NSLocalNetworkUsageDescription: リモートモニターで、近くのスマホに撮影画面を映し、そこからシャッターを押せるようにします。
        NSBonjourServices:
          - _posecam-mon._tcp
          - _posecam-mon._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.posecam
        # アプリアイコン（PoseCam/AppIcon.icon、Icon Composer 形式。Xcode 26 以降でビルドする）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 美肌の Core Image カーネル（BeautyKernels.ci.metal）を Core Image 用にコンパイルする
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
        # iPhone と iPad（iPad mini など）
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # Apple Watch のアプリ（ペアの iPhone の撮影画面を映し、シャッター・セルフタイマー・連続撮影の枚数を操作する）
  PoseCamWatch:
    type: application
    platform: watchOS
    sources:
      - path: PoseCamWatch
    info:
      path: PoseCamWatch/Info.plist
      properties:
        CFBundleDisplayName: ポーズカメラ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.posecam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.posecam.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
